name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: OpenAPI drift check
        run: |
          uv run python -m guardian.tools.export_openapi
          git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated OpenAPI types are up to date
        run: |
          npm run gen:openapi
          git diff --exit-code src/types/generated/openapi.d.ts

  chain-l1:
    # L1 adapter + the ChainPort conformance suite against a real EVM: anvil + the Foundry artifacts
    # (the sim half of the conformance suite also runs in `backend`; the l1 half skips without Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock
      - run: uv python install 3.12
      - run: contracts/scripts/install-deps.sh
      - run: forge build
        working-directory: contracts
      - run: uv sync
        working-directory: Backend
      - name: L1 adapter tests, conformance (sim vs l1) and API e2e on anvil
        working-directory: Backend
        run: uv run pytest tests/chain_l1 tests/conformance -q -rs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned Solidity dependencies
        run: contracts/scripts/install-deps.sh
      - name: forge fmt --check
        run: forge fmt --check
        working-directory: contracts
      - name: forge build (warnings are errors)
        run: forge build
        working-directory: contracts
      - name: forge test (ci profile, deeper fuzz and invariant runs)
        run: forge test -vv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
      - name: ABI copies are up to date
        run: |
          contracts/scripts/export-abis.sh
          git diff --exit-code -- Backend/src/guardian/chain/abis

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: postgresql+asyncpg://guardian:ci-only@localhost:5432/guardian
      TEST_DATABASE_URL: postgresql+asyncpg://guardian:ci-only@localhost:5432/guardian
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync
      - name: alembic upgrade head / downgrade base exit 0
        run: uv run alembic upgrade head && uv run alembic downgrade base
      - name: Schema, unique (tx_hash, log_index), clean downgrade
        run: uv run pytest -q -rs tests/test_db_migrations.py
      - name: API suite on Postgres (events, attempts, runs, proposals, agent runs, assistant logs persisted)
        run: uv run alembic upgrade head && uv run pytest -q -rs --ignore=tests/chain_l1 -k "not l1"

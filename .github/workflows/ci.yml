name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chain-l1:
    # L1 adapter against a real EVM: anvil + the Foundry artifacts (skipped locally when Foundry is absent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Backend/uv.lock
      - run: uv python install 3.12
      - run: contracts/scripts/install-deps.sh
      - run: forge build
        working-directory: contracts
      - run: uv sync
        working-directory: Backend
      - name: L1 adapter tests
        working-directory: Backend
        run: uv run pytest tests/chain_l1 -q -rs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned Solidity dependencies
        run: contracts/scripts/install-deps.sh
      - name: forge fmt --check
        run: forge fmt --check
        working-directory: contracts
      - name: forge build (warnings are errors)
        run: forge build
        working-directory: contracts
      - name: forge test
        run: forge test -vv
        working-directory: contracts
      - name: ABI copies are up to date
        run: |
          contracts/scripts/export-abis.sh
          git diff --exit-code -- Backend/src/guardian/chain/abis

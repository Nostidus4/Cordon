[project]
name = "guardian-backend"
version = "0.1.0"
description = "GuardianAI / Cordon backend: indexer, graph, simulator, API, agent"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "web3>=8.0.0",
]

[project.scripts]
guardian-api = "guardian.main:run"
guardian-worker = "guardian.workers.main:main"
guardian-agent = "guardian.agent_rebalance.main:main"
guardian-attacker = "guardian.attacker.cli:main"
guardian-seed = "guardian.seed_cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "guardian"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

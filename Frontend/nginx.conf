server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/javascript
             image/svg+xml model/gltf-binary application/octet-stream;

  # Backend proxy (only used when the web build runs with VITE_API_MODE=live).
  # BACKEND_URL defaults to the compose service; SSE needs buffering off.
  location /api/ {
    set $backend http://api:8000;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location /models/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}

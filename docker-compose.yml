services:
  api:
    build: ./Backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./Backend/.env
        required: false
    restart: unless-stopped

  web:
    build:
      context: ./Frontend
      args:
        VITE_API_MODE: live
        VITE_BASE: /
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # Postgres: `make db-up` (= docker compose --profile db up -d db), then `make db-migrate`.
  db:
    image: postgres:16
    profiles: [db]
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: guardian
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
